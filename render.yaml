services:
  - type: web
    name: reelgram
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: INSTAGRAM_USERNAME
        sync: false
      - key: INSTAGRAM_PASSWORD
        sync: false
      - key: INSTAGRAM_SESSION_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: reelgram
      - key: OWNER_ID
        sync: false
      - key: FORCE_SUB_INSTAGRAM
        value: "true"
      - key: FORCE_SUB_CHANNEL_ID
        sync: false
      - key: FORCE_SUB_INVITE_LINK
        sync: false
      - key: DEVELOPER_USERNAME
        value: MrTG_Coder
      - key: LOG_LEVEL
        value: INFO
      - key: DOWNLOAD_PATH
        value: downloads/

